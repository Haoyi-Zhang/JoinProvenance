name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded owned finite campaign and discrete gates
        shell: bash
        run: |
          mkdir -p scientific-output
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 600s bash -euo pipefail -c '
            ulimit -v 3145728
            ulimit -t 600
            python -B .github/scripts/check_repository.py
            python -B reproduce.py --next 97 --out scientific-output/results
            python -B reproduce.py --out scientific-output/results --compare
            python -B summarize.py --results scientific-output/results \
              --analysis scientific-output/analysis \
              --ledger scientific-output/results/run-ledger.csv
          ' 2>&1 | tee scientific-output/whole-run.txt
      - name: Check producer subtotal reuse with independent finite partitions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python -B tests/subtotal_regression.py \
            > scientific-output/subtotal-regression.log 2>&1
          timeout --signal=TERM --kill-after=10s 180s \
            python -B -O tests/subtotal_regression.py \
            > scientific-output/subtotal-regression-optimized.log 2>&1
      - name: Check checker subtotal reuse with independent literal partitions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -B tests/checker_subtotal_regression.py \
            > scientific-output/checker-subtotal-regression.log 2>&1
          timeout --signal=TERM --kill-after=10s 120s \
            python -B -O tests/checker_subtotal_regression.py \
            > scientific-output/checker-subtotal-regression-optimized.log 2>&1
      - name: Retain raw outputs even when a scientific gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
